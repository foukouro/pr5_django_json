{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f2">
    <title>{% block title %}Сервис поддержки{% endblock %} | Принятие</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'homepage/css/style.css' %}" rel="stylesheet">
</head>
<body>
    {% include "includes/navigation.html" %}
    <main class="page-main container">
        {% block content %}{% endblock %}
    </main>
    <footer class="page-footer mt-5 py-4">
        <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
            <span>Учебный проект · Сервис «Принятие»</span>
            <span>© <span id="current-year"></span></span>
        </div>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
