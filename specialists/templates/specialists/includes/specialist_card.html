<article class="card specialist-card h-100">
    <div class="card-body d-flex flex-column">
        <p class="section-label mb-2">Специалист</p>
        <h2 class="card-title h4">{{ specialist.name|default:"Без имени" }}</h2>
        <p class="specialist-focus">{{ specialist.specialization }}</p>
        <p class="text-secondary mb-4">Опыт: {{ specialist.experience_years }} лет</p>
        <a class="btn btn-outline-success mt-auto align-self-start"
           href="{% url 'specialists:detail' specialist.id %}">
            Подробнее
        </a>
    </div>
</article>
