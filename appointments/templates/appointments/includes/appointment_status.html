{% if appointment.status == "Отменена" %}
    <span class="badge bg-secondary appointment-status appointment-status-cancelled">
        {{ appointment.status }}
    </span>
{% elif appointment.status == "Подтверждена" %}
    <span class="badge bg-success appointment-status">{{ appointment.status }}</span>
{% else %}
    <span class="badge bg-warning text-dark appointment-status">{{ appointment.status }}</span>
{% endif %}
